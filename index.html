<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16101e"><title>Наш кинозал — Женя и Юля</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34233e,#120f1b 65%);color:#f9f0f7;min-height:100vh}main{max-width:850px;margin:auto;padding:28px 18px 90px}header{text-align:center;margin:24px 0 32px}h1{font-size:clamp(32px,7vw,55px);margin:8px 0;color:#ffd1df}header p{color:#d9b7d3}.panel{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 8px 35px #0002}h2{margin:0 0 16px;font-size:21px}input,select,textarea,button{font:inherit;border-radius:12px;padding:12px;color:#fff}button{min-height:43px}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #f5a4c5;outline-offset:2px}input,select,textarea{background:#211b2b;border:1px solid #ffffff30;min-width:0;width:100%}textarea{resize:vertical}button{background:#b85b88;border:0;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.15)}button.secondary{background:#393044}button.danger{background:#653448}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>*{min-width:0}.full{grid-column:1/-1}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1;white-space:nowrap}.tabs button.active{background:#e78bac;color:#1d1120}.film{display:flex;gap:14px;border-bottom:1px solid #ffffff1b;padding:15px 0;align-items:flex-start}.film:last-child{border:0}.poster{width:72px;height:105px;object-fit:cover;border-radius:9px;background:#3b2e43;flex:none}.film-info{flex:1;min-width:0}.film h3{margin:0 0 6px;overflow-wrap:anywhere}.meta{color:#bbaabd;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.actions button{font-size:13px;padding:9px 11px;min-height:40px}.empty{text-align:center;color:#baa8bc;padding:32px 10px}.small{font-size:13px;color:#c6b5c8}.stats{display:flex;justify-content:space-around;gap:10px;text-align:center}.stats strong{display:block;font-size:27px;color:#ffc4d8}.result{font-size:22px;text-align:center;color:#ffccde;padding:12px}a{color:#ffbbd4}@media(max-width:500px){main{padding:12px 12px 70px}header{margin:20px 0 23px}.grid{grid-template-columns:1fr}.stats{gap:8px}.panel{padding:16px;margin:13px 0}.film{gap:11px}.poster{width:62px;height:92px}.actions{gap:7px}.tabs button{font-size:12px;padding:11px 6px}} </style></head><body><main>
<header><div style="font-size:35px">♡ 🎬 ♡</div><h1>Наш кинозал</h1><p>Женя & Юля · Наша история в фильмах</p></header>
<section class="panel"><div class="stats"><div><strong id="total">0</strong>в списке</div><div><strong id="watched">0</strong>посмотрели</div><div><strong id="favorites">0</strong>любимых</div></div></section>
<p id="cloudStatus" class="small" style="text-align:center;margin:-8px 0 16px" aria-live="polite">Подключение…</p><section class="panel"><h2>Добавить фильм</h2><form id="form" class="grid"><input name="title" placeholder="Название фильма" maxlength="120" required><input name="year" placeholder="Год" inputmode="numeric" maxlength="4"><input name="genre" placeholder="Жанр"><select name="who"><option>Женя</option><option>Юля</option><option>Вместе</option></select><input name="poster" class="full" placeholder="Ссылка на постер (необязательно)"><textarea name="note" class="full" rows="2" placeholder="Почему хотим посмотреть?"></textarea><button class="full" id="addFilm" disabled>Добавить в наш список ♡</button></form></section>
<section class="panel"><h2>Что посмотрим сегодня?</h2><button id="random">🎲 Выбрать случайный фильм</button><div class="result" id="choice" aria-live="polite"></div></section>
<section class="panel"><div class="tabs"><button data-tab="queue" class="active">Хотим посмотреть</button><button data-tab="watched">Посмотрели</button><button data-tab="fav">♡ Избранное</button></div><p><input id="search" placeholder="Поиск по фильмам..."></p><div id="films"></div></section>
<footer class="small" style="text-align:center">Женя ♡ Юля</footer></main><script>
const KEY="our-movie-nights-v1";let movies=[];let tab="queue";try{movies=JSON.parse(localStorage.getItem(KEY))||[]}catch{}const $=id=>document.getElementById(id);const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const save=(change)=>{render();window.cloudPush?.(change)};window.cloudApply=(incoming)=>{movies=incoming;render()};window.cloudReady=()=>{$("addFilm").disabled=false};window.cloudBusy=()=>{$("addFilm").disabled=true};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
$("form").onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const title=v.title.trim();if(movies.some(m=>m.title.trim().toLocaleLowerCase("ru")===title.toLocaleLowerCase("ru"))){alert("Этот фильм уже есть в списке");return}const film={...v,title,id:uid(),watched:false,fav:false,rate1:0,rate2:0,date:""};e.target.reset();save({type:"upsert",film})};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));render()});$("search").oninput=render;
function render(){$("total").textContent=movies.filter(x=>!x.watched).length;$("watched").textContent=movies.filter(x=>x.watched).length;$("favorites").textContent=movies.filter(x=>x.fav).length;let list=movies.filter(x=>tab==="queue"?!x.watched:tab==="watched"?x.watched:x.fav).filter(x=>(x.title+" "+x.genre).toLowerCase().includes($("search").value.toLowerCase()));$("films").innerHTML=list.length?list.map(m=>'<article class="film">'+(m.poster?'<img class="poster" src="'+esc(m.poster)+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="poster" style="display:grid;place-items:center;font-size:30px">🎞️</div>')+'<div class="film-info"><h3>'+esc(m.title)+' '+(m.fav?'♥':'')+'</h3><div class="meta">'+esc([m.year,m.genre,"Предложил(а): "+m.who].filter(Boolean).join(" · "))+'</div>'+(m.note?'<p class="small">'+esc(m.note)+'</p>':'')+(m.watched?'<div class="small">Оценки: Женя '+(m.rate1||"—")+'/10 · Юля '+(m.rate2||"—")+'/10</div>':'')+'<div class="actions"><button data-action="watch" data-id="'+m.id+'">'+(m.watched?'↩ В планы':'✓ Посмотрели')+'</button><button data-action="fav" data-id="'+m.id+'" class="secondary">'+(m.fav?'♥ Убрать':'♡ Любимый')+'</button>'+(m.watched?'<button data-action="rate" data-id="'+m.id+'" class="secondary">★ Оценить</button>':'')+'<button data-action="edit" data-id="'+m.id+'" class="secondary">Изменить</button><button data-action="del" data-id="'+m.id+'" class="danger">×</button></div></div></article>').join(""):'<div class="empty">Здесь пока нет фильмов ♡</div>'}
$("films").onclick=e=>{const b=e.target.closest("button[data-action]");if(!b)return;const original=movies.find(x=>x.id===b.dataset.id);if(!original)return;const m={...original};switch(b.dataset.action){case"watch":m.watched=!m.watched;m.date=m.watched?new Date().toISOString().slice(0,10):"";break;case"fav":m.fav=!m.fav;break;case"rate":{const a=prompt("Оценка Жени (1–10, пусто — без оценки)",m.rate1||"");if(a===null)return;const c=prompt("Оценка Юли (1–10, пусто — без оценки)",m.rate2||"");if(c===null)return;if([a,c].some(v=>v.trim()!==""&&(!Number.isInteger(Number(v))||Number(v)<1||Number(v)>10))){alert("Оценка должна быть целым числом от 1 до 10");return}m.rate1=a.trim()?Number(a):0;m.rate2=c.trim()?Number(c):0;break}case"edit":{let t=prompt("Название фильма",m.title);if(t&&t.trim())m.title=t.trim();let n=prompt("Заметка",m.note||"");if(n!==null)m.note=n;break}case"del":if(!confirm("Удалить «"+m.title+"»?"))return;save({type:"delete",id:m.id});return}save({type:"upsert",film:m})};
$("random").onclick=()=>{const q=movies.filter(m=>!m.watched);$("choice").textContent=q.length?"Сегодня смотрим: "+q[Math.floor(Math.random()*q.length)].title+" ♡":"Сначала добавьте фильмы в список!"};
render();
</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,onSnapshot,runTransaction} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCswTwOSF9ulU2BpP4rirc5K8E_k4TE8nc",authDomain:"zhenya-yulya-cinema.firebaseapp.com",projectId:"zhenya-yulya-cinema",appId:"1:974599365331:web:5ff97e75a4eff53334aa26"});
const db=getFirestore(app),status=document.getElementById("cloudStatus");
const roomRef=doc(db,"rooms","8b7e23a9d45c6012f83e4b0a7c96d125e0f4a8b3");
if(location.hash.startsWith("#room="))history.replaceState(null,"",location.pathname+location.search);
let connected=false,queue=Promise.resolve();
const setStatus=s=>status.textContent=s;
const apply=(arr,change)=>{const list=[...arr];const index=list.findIndex(x=>x.id===(change.id||change.film?.id));if(change.type==="delete"){if(index>=0)list.splice(index,1)}else if(index>=0)list[index]={...list[index],...change.film};else list.unshift(change.film);return list};
window.cloudPush=change=>{if(!connected){setStatus("Нет подключения. Изменение не сохранено.");return}queue=queue.catch(()=>{}).then(async()=>{setStatus("Сохраняем…");try{await runTransaction(db,async tx=>{const snapshot=await tx.get(roomRef);const current=Array.isArray(snapshot.data()?.movies)?snapshot.data().movies:[];tx.set(roomRef,{movies:apply(current,change),updatedAt:Date.now()})});setStatus("♡ Синхронизировано")}catch(e){setStatus("Не сохранилось: "+(e.code||"ошибка")+". Повтори действие.");alert("Изменение не сохранилось в общем списке. Проверь интернет и повтори действие.")}})};
try{
  await signInAnonymously(getAuth(app));
  const unsubscribe=onSnapshot(roomRef,snapshot=>{
    if(!snapshot.exists()){if(!connected){connected=true;window.cloudReady();setStatus("♡ Общий список подключён")}return}
    connected=true;window.cloudReady();
    window.cloudApply(Array.isArray(snapshot.data().movies)?snapshot.data().movies:[]);
    if(status.textContent!=="Сохраняем…")setStatus("♡ Синхронизировано");
  },e=>{connected=false;window.cloudBusy();setStatus("Нет доступа к базе: "+(e.code||"ошибка"))});
  // Initialize the shared room only if it does not exist; preserve existing cloud data.
  await runTransaction(db,async tx=>{const snap=await tx.get(roomRef);if(!snap.exists())tx.set(roomRef,{movies:[],updatedAt:Date.now()})});
}catch(e){connected=false;window.cloudBusy();setStatus("Не удалось подключиться: "+(e.code||"ошибка"))}
</script></body></html>
